<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#0b1329" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Neural Mesh Lines in Background -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="200" y1="120" x2="400" y2="240" />
    <line x1="400" y1="240" x2="600" y2="180" />
    <line x1="600" y1="180" x2="800" y2="280" />
    <line x1="800" y1="280" x2="1000" y2="150" />
    <line x1="400" y1="240" x2="500" y2="420" />
    <line x1="500" y1="420" x2="700" y2="400" />
    <line x1="700" y1="400" x2="800" y2="280" />
    <line x1="250" y1="360" x2="500" y2="420" />
    <line x1="700" y1="400" x2="950" y2="440" />
  </g>

  <!-- Nodes -->
  <circle cx="200" cy="120" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="400" cy="240" r="6" fill="#60a5fa" opacity="0.8"/>
  <circle cx="600" cy="180" r="5" fill="#a78bfa" opacity="0.7"/>
  <circle cx="800" cy="280" r="7" fill="#38bdf8" opacity="0.9"/>
  <circle cx="1000" cy="150" r="4" fill="#22d3ee" opacity="0.6"/>
  <circle cx="500" cy="420" r="6" fill="#818cf8" opacity="0.8"/>
  <circle cx="700" cy="400" r="5" fill="#38bdf8" opacity="0.7"/>

  <!-- Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Subtitle Tag -->
  <g transform="translate(600, 160)">
    <rect x="-180" y="-20" width="360" height="40" rx="20" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
      AI &amp; DATA SCIENCE ENGINEERING STUDENT
    </text>
  </g>

  <!-- Main Name Heading -->
  <text x="600" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">
    RUCHITHA
  </text>

  <!-- Tagline -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">
    Learning • Building • Exploring Intelligence
  </text>

  <!-- Divider line -->
  <line x1="400" y1="385" x2="800" y2="385" stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- Institution Meta -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    2nd Year Undergrad • REVA University • Merit KCET
  </text>

  <!-- Tools Pill -->
  <g transform="translate(600, 485)">
    <text x="0" y="14" font-family="monospace" font-size="14" fill="#67e8f9" text-anchor="middle" letter-spacing="2">
      PYTHON • C • C++ • DATA SCIENCE • IOT
    </text>
  </g>
</svg>
